<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>駅伝タスキ計時</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header with tabs; race view = fixed-order grid of large tappable team cards (iPad landscape first) */
:root{
  --paper:#f3f4f7; --card:#ffffff; --ink:#18203a; --muted:#5d6580; --line:#d9dce6;
  --ai:#25358f;          /* 藍: primary accent */
  --ai-soft:#e4e7f6;
  --sash:#b4232f;        /* タスキ: pass button */
  --sash-ink:#ffffff;
  --ok:#1d7a4c; --ok-soft:#dff1e7; --warn:#a35b00; --warn-soft:#fbecd6;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141f; --card:#1a1f2e; --ink:#e8eaf2; --muted:#9aa1b9; --line:#2c3347;
  --ai:#8d9cf0; --ai-soft:#262e4f; --sash:#d84552; --sash-ink:#ffffff;
  --ok:#5fd19a; --ok-soft:#173a2a; --warn:#f0b35c; --warn-soft:#3d2d14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11141f; --card:#1a1f2e; --ink:#e8eaf2; --muted:#9aa1b9; --line:#2c3347;
  --ai:#8d9cf0; --ai-soft:#262e4f; --sash:#d84552; --sash-ink:#ffffff;
  --ok:#5fd19a; --ok-soft:#173a2a; --warn:#f0b35c; --warn-soft:#3d2d14; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.02em;white-space:nowrap}
.brand .ev{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:999px}
.tabs a{padding:8px 18px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.tabs a[aria-current="page"]{background:var(--ai);color:#fff}

main .wrap{padding-block:20px 60px}
h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0 0 12px;text-wrap:balance}
.lbl{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.note{color:var(--muted);font-size:13px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--ai)}
a.btn{color:var(--ink);display:inline-block}
.btn.primary{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.danger{color:var(--sash);border-color:var(--sash)}
.btn.danger.armed{background:var(--sash);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* race */
.board{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.clock{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(44px,8vw,84px);line-height:1;letter-spacing:-.02em}
.clockmeta{display:flex;flex-direction:column;gap:4px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.run .dot{background:var(--sash);animation:blink 1s steps(2) infinite}
.status.done .dot{background:var(--ok)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status.run .dot{animation:none}}
.startbtn{font-family:var(--f-display);font-weight:400;font-size:28px;background:var(--ai);color:#fff;border:0;border-radius:14px;padding:18px 48px;min-height:80px}
.board .spacer{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.team{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.team.flash{animation:flash .6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px var(--tc)}100%{box-shadow:0 0 0 0 transparent}}
.team .hd{display:flex;align-items:center;gap:8px;justify-content:space-between}
.chip{background:var(--tc);color:var(--tci,#fff);font-weight:700;border-radius:6px;padding:3px 10px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.legpos{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.rank{font-size:12px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.runner{font-size:20px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.legtime{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1.1}
.prev{font-size:13px;color:var(--muted);min-height:1.5em}
.pass{background:var(--sash);color:var(--sash-ink);border:0;border-radius:10px;min-height:92px;padding:10px;font-family:var(--f-display);font-weight:400;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pass small{font-family:var(--f-body);font-size:14px;font-weight:700;opacity:.9}
.pass.goal{background:var(--ink);color:var(--paper)}
.pass:active{transform:scale(.98)}
.pass:disabled{opacity:.35;cursor:not-allowed}
.undo{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted);font-weight:700}
.undo.armed{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.fin{display:flex;align-items:baseline;gap:10px;color:var(--ok);font-weight:700}
.fin b{font-family:var(--f-display);font-weight:400;font-size:30px}
.team.done{background:var(--ok-soft);border-color:transparent}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* setup */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field input,.field select,textarea,.tinput{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-size:20px;font-weight:700}
.stepper output{font-family:var(--f-num);font-size:20px;min-width:2.5ch;text-align:center}
.teams{display:flex;flex-direction:column;gap:12px}
.tedit{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.tedit .h{display:flex;gap:10px;align-items:center}
.swatch{width:40px;height:40px;border-radius:8px;background:var(--tc);flex:none;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;color:var(--tci,#fff);font-size:11px;font-weight:700}
.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.palette button{width:36px;height:36px;border-radius:8px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.palette label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-left:6px}
.palette input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--paper)}
.tedit .h input{flex:1;font-weight:700;background:var(--card)}
.runners{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.runners label{display:flex;align-items:center;gap:6px;min-width:0}
.runners span{font-family:var(--f-num);font-size:12px;color:var(--muted);width:2.6em;flex:none}
.runners input{background:var(--card)}
textarea{min-height:120px;font-family:var(--f-num);font-size:13px}
details summary{cursor:pointer;font-weight:700}

/* results */
.rtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ai);color:#fff}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);letter-spacing:.05em;background:var(--paper);position:sticky;top:0}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;font-weight:700;letter-spacing:inherit}
th button[data-dir]::after{content:attr(data-dir);margin-left:4px;color:var(--ai)}
td.t{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.rk{font-family:var(--f-display);font-size:16px}
tr:last-child td{border-bottom:0}
.tdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--tc);margin-right:6px;vertical-align:middle}
.best{color:var(--sash);font-weight:700}
.mini{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:14px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.err{color:var(--sash);font-size:13px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:600px){.brand .ev{display:none}.tabs a{padding:7px 12px}.startbtn{width:100%}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>駅伝タスキ計時</h1><span class="ev" id="evName"></span></div>
  <nav class="tabs" aria-label="画面">
    <a href="#setup" data-view="setup">設定</a>
    <a href="#race" data-view="race">計測</a>
    <a href="#results" data-view="results">記録</a>
  </nav>
</div></header>

<main><div class="wrap">
  <section id="v-setup" hidden></section>
  <section id="v-race" hidden></section>
  <section id="v-results" hidden></section>
</div></main>

<div class="modal" id="modal" hidden>
  <form class="box" id="modalForm">
    <h2 id="mTitle">時刻を修正</h2>
    <div class="note" id="mNote"></div>
    <input class="tinput num" id="mInput" inputmode="decimal" autocomplete="off" placeholder="10:23:45.6">
    <div class="err" id="mErr"></div>
    <div class="row" style="justify-content:flex-end">
      <button type="button" class="btn" id="mCancel">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
const KEY = "ekiden-timer-v1";
const COLORS = ["#c62f3b","#1f5fbf","#1d8a5b","#c77d00","#7b3fb4","#0f8a9a","#c2417e","#5b6b17","#8a5a2b","#46557a","#e0602a","#2a7f3f","#9c2b6e","#3a6fd1","#6b6b6b","#00897b"];
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function sampleState(){
  const t = (name, rs) => ({ id: uid(), name, runners: rs });
  return {
    v: 1, sample: true, eventName: "〇〇学科 駅伝大会", legs: 5, guard: 3,
    teams: [
      t("1年A", ["青木","伊藤","上田","江藤","小川"]),
      t("1年B", ["加藤","木村","工藤","剣持","小林"]),
      t("2年", ["佐藤","清水","須藤","関","園田"]),
      t("院生・教員", ["田中","千葉","津田","寺島","豊田"])
    ],
    race: { start: null, splits: {} }
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S || !Array.isArray(S.teams)) S = sampleState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- time helpers ---------- */
function fmtDur(ms){
  if (ms == null || !isFinite(ms)) return "—";
  if (ms < 0) ms = 0;
  const t = Math.floor(ms / 100), d = t % 10, s = Math.floor(t / 10) % 60, m = Math.floor(t / 600) % 60, h = Math.floor(t / 36000);
  const ss = String(s).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2,"0")}:${ss}.${d}` : `${m}:${ss}.${d}`;
}
function fmtClock(ep, tenth){
  if (ep == null) return "—";
  const d = new Date(ep), p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` + (tenth ? "." + Math.floor(d.getMilliseconds()/100) : "");
}
function parseClock(str, baseEp){
  const m = String(str).trim().replace(/：/g, ":").match(/^(\d{1,2}):(\d{1,2}):(\d{1,2})(?:\.(\d{1,3}))?$/);
  if (!m) return null;
  const d = new Date(baseEp);
  d.setHours(+m[1], +m[2], +m[3], m[4] ? Math.round(+("0." + m[4]) * 1000) : 0);
  return d.getTime();
}

/* ---------- derived ---------- */
const color = (i) => (S.teams[i] && S.teams[i].color) || COLORS[i % COLORS.length];
function inkFor(hex){ const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#fff"; const n = parseInt(m[1], 16);
  const L = c => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); };
  const lum = .2126 * L(n >> 16) + .7152 * L((n >> 8) & 255) + .0722 * L(n & 255); return lum > .4 ? "#14182a" : "#ffffff"; }
const tcs = (i) => `--tc:${color(i)};--tci:${inkFor(color(i))}`;
let openPalette = null;
const splits = t => S.race.splits[t.id] || (S.race.splits[t.id] = []);
const started = () => S.race.start != null;
const finished = t => splits(t).length >= S.legs;
const allDone = () => started() && S.teams.length > 0 && S.teams.every(finished);
function legStart(t, i){ return i === 0 ? S.race.start : splits(t)[i - 1]; }
function total(t){ return finished(t) ? splits(t)[S.legs - 1] - S.race.start : null; }
function standings(){
  return S.teams.map((t, idx) => ({ t, idx, n: splits(t).length, last: splits(t).length ? splits(t)[splits(t).length - 1] : Infinity }))
    .sort((a, b) => b.n - a.n || a.last - b.last || a.idx - b.idx);
}
function positionOf(t){
  if (!started() || splits(t).length === 0) return null;
  return standings().findIndex(x => x.t === t) + 1;
}
function legRanks(i){ // map teamId -> rank for leg i
  const arr = S.teams.filter(t => splits(t).length > i).map(t => ({ id: t.id, lap: splits(t)[i] - legStart(t, i) })).sort((a, b) => a.lap - b.lap);
  const r = {}; arr.forEach((x, k) => { r[x.id] = (k > 0 && x.lap === arr[k-1].lap) ? r[arr[k-1].id] : k + 1; }); return r;
}
function individualRows(){
  const ranks = Array.from({ length: S.legs }, (_, i) => legRanks(i));
  const rows = [];
  S.teams.forEach((t, ti) => {
    for (let i = 0; i < S.legs; i++) {
      const done = splits(t).length > i;
      const st = started() && splits(t).length >= i ? legStart(t, i) : null;
      rows.push({ team: t, ti, leg: i + 1, name: t.runners[i] || "", start: st, end: done ? splits(t)[i] : null,
        lap: done ? splits(t)[i] - legStart(t, i) : null, rank: done ? ranks[i][t.id] : null });
    }
  });
  return rows;
}

/* ---------- UI plumbing ---------- */
let toastTimer;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2600); }
let view = "race";
function route(){
  const h = location.hash.replace("#", "");
  view = ["setup","race","results"].includes(h) ? h : (started() ? "race" : "setup");
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.view === view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  ["setup","race","results"].forEach(v => $("#v-" + v).hidden = v !== view);
  render();
}
function render(){
  $("#evName").textContent = S.eventName || "";
  if (view === "setup") renderSetup();
  else if (view === "race") renderRace();
  else renderResults();
}
const sampleBanner = () => S.sample ? `<div class="banner">表示中のチームと名前はサンプルです。「設定」で自分たちのチームに書き換えてください。</div>` : "";

/* ---------- setup ---------- */
let armedReset = 0;
function renderSetup(){
  const lock = started();
  const el = $("#v-setup");
  el.innerHTML = `${sampleBanner()}
  <div class="panel">
    <h2>大会</h2>
    <div class="fields">
      <label class="field"><span class="lbl">大会名</span><input id="f-ev" value="${esc(S.eventName)}"></label>
      <div class="field"><span class="lbl">1チームの人数（区間数）</span>
        <div class="stepper"><button type="button" id="legMinus" ${lock?"disabled":""} aria-label="減らす">−</button><output id="legOut">${S.legs}</output><button type="button" id="legPlus" ${lock?"disabled":""} aria-label="増やす">＋</button><span class="note">人 / 区</span></div></div>
      <label class="field"><span class="lbl">二重押し防止（秒）</span><input id="f-guard" type="number" min="0" max="60" step="1" value="${S.guard}"><span class="note">同じチームの連続タップをこの秒数だけ無視します</span></label>
    </div>
    ${lock ? `<p class="note">計測が始まっているため、人数とチーム数は変更できません。名前の修正はできます。</p>` : ""}
  </div>
  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">チームと走順（${S.teams.length}チーム）</h2>
      <button class="btn primary" id="addTeam" ${lock?"disabled":""}>チームを追加</button></div>
    <div class="teams">${S.teams.map((t, i) => `
      <div class="tedit" style="${tcs(i)}" data-team="${t.id}">

          <button class="btn danger" data-act="del" ${lock?"disabled":""}>削除</button></div>
        ${openPalette === t.id ? `<div class="palette">${COLORS.map(c => `<button type="button" data-col="${c}" style="background:${c}" aria-label="色 ${c}" aria-pressed="${color(i).toLowerCase() === c.toLowerCase()}"></button>`).join("")}
          <label>ほかの色 <input type="color" data-f="color" value="${color(i)}"></label></div>` : ""}
        <div class="runners">${Array.from({length: S.legs}, (_, k) => `
          <label><span>${k+1}区</span><input class="tinput" data-f="r" data-k="${k}" value="${esc(t.runners[k] || "")}" placeholder="${k+1}走の名前"></label>`).join("")}

      <textarea id="bulk" placeholder="1年A	青木	伊藤	上田	江藤	小川&#10;1年B	加藤	木村	工藤	剣持	小林"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="bulkGo" ${lock?"disabled":""}>取り込む</button></div>
    </details>
  </div>
  <div class="panel">
    <h2>データ</h2>
    <p class="note">設定と記録はこの端末のブラウザに自動で保存されます。ブラウザのデータを消すと失われるので、大会後は「記録」からエクセルに書き出してください。別の端末へ移すときはバックアップを使います。</p>
    <div class="row">
      <button class="btn" id="bk">バックアップを保存（.json）</button>
      <button class="btn" id="rs">バックアップから復元</button>
      <button class="btn danger ${armedReset > Date.now() ? "armed" : ""}" id="resetRace" ${started()?"":"disabled"}>${armedReset > Date.now() ? "もう一度押すと記録を消去" : "計測記録をリセット"}</button>
      <button class="btn" id="clearSample">${S.sample ? "サンプルを消して空から作る" : "設定を空にする"}</button>
    </div>
  </div>`;
}
function touchSetup(){ if (S.sample) { S.sample = false; } save(); }
document.addEventListener("input", e => {
  const tg = e.target;
  if (tg.id === "f-ev") { S.eventName = tg.value; touchSetup(); $("#evName").textContent = S.eventName; return; }
  if (tg.id === "f-guard") { S.guard = Math.max(0, Math.min(60, +tg.value || 0)); save(); return; }
  const box = tg.closest(".tedit"); if (!box) return;
  const t = S.teams.find(x => x.id === box.dataset.team); if (!t) return;
  if (tg.dataset.f === "name") t.name = tg.value;
  if (tg.dataset.f === "r") t.runners[+tg.dataset.k] = tg.value;
  if (tg.dataset.f === "color") { t.color = tg.value; box.style.setProperty("--tc", tg.value); box.style.setProperty("--tci", inkFor(tg.value)); box.querySelectorAll(".palette button").forEach(x => x.setAttribute("aria-pressed", "false")); }
  touchSetup();
});
let clearArmed = 0;
$("#v-setup").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "legMinus" || b.id === "legPlus") { S.legs = Math.max(1, Math.min(30, S.legs + (b.id === "legPlus" ? 1 : -1))); touchSetup(); renderSetup(); }
  else if (b.dataset.act === "color") { const id = b.closest(".tedit").dataset.team; openPalette = openPalette === id ? null : id; renderSetup(); }
  else if (b.dataset.col) { const t = S.teams.find(x => x.id === b.closest(".tedit").dataset.team); t.color = b.dataset.col; save(); renderSetup(); }
  else if (b.id === "addTeam") { S.teams.push({ id: uid(), name: `チーム${S.teams.length + 1}`, runners: [] }); touchSetup(); renderSetup(); }
  else if (b.dataset.act === "del") { const id = b.closest(".tedit").dataset.team; S.teams = S.teams.filter(t => t.id !== id); delete S.race.splits[id]; touchSetup(); renderSetup(); }
  else if (b.id === "bulkGo") {
    const lines = $("#bulk").value.split(/\r?\n/).map(l => l.split(/\t|,|，/).map(s => s.trim())).filter(c => c[0]);
    if (!lines.length) { toast("取り込む行がありません"); return; }
    S.teams = lines.map(c => ({ id: uid(), name: c[0], runners: c.slice(1).filter((_, i, a) => true) }));
    const mx = Math.max(...S.teams.map(t => { let r = t.runners; while (r.length && !r[r.length-1]) r.pop(); return r.length; }));
    if (mx > 0) S.legs = mx;
    S.race = { start: null, splits: {} }; touchSetup(); renderSetup(); toast(`${S.teams.length}チームを取り込みました`);
  }
  else if (b.id === "bk") backup();
  else if (b.id === "rs") $("#fileIn").click();
  else if (b.id === "resetRace") {
    if (armedReset > Date.now()) { S.race = { start: null, splits: {} }; armedReset = 0; save(); toast("計測記録をリセットしました"); releaseWake(); }
    else { armedReset = Date.now() + 4000; setTimeout(() => view === "setup" && renderSetup(), 4100); }
    renderSetup();
  }
  else if (b.id === "clearSample") {
    if (clearArmed > Date.now() || S.sample) {
      S = { v: 1, sample: false, eventName: S.sample ? "" : S.eventName, legs: S.legs, guard: S.guard, teams: [{ id: uid(), name: "チーム1", runners: [] }], race: { start: null, splits: {} } };
      clearArmed = 0; save(); renderSetup(); toast("設定を空にしました");
    } else { clearArmed = Date.now() + 4000; b.textContent = "もう一度押すと記録も含めて消去"; b.classList.add("danger","armed"); }
  }
});
$("#fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.teams) || !d.legs || !d.race) throw 0;
      S = d; save(); render(); toast("バックアップから復元しました");
    } catch(err) { toast("このファイルは読み込めませんでした。このアプリで保存した .json を選んでください"); }
    e.target.value = "";
  };
  rd.readAsText(f);
});

/* ---------- race ---------- */
const lastTap = {}; const undoArmed = {};
function renderRace(){
  const el = $("#v-race");
  const st = started(), done = allDone();
  const finishedCount = S.teams.filter(finished).length;
  const endEp = done ? Math.max(...S.teams.map(t => splits(t)[S.legs - 1])) : null;
  el.innerHTML = `${sampleBanner()}
  <div class="board">
    <div class="clock" ${st && !done ? `data-since="${S.race.start}"` : ""}>${st ? fmtDur((done ? endEp : Date.now()) - S.race.start) : "0:00.0"}</div>
    <div class="clockmeta">
      <span class="status ${done ? "done" : st ? "run" : ""}"><span class="dot"></span>${done ? "全チームゴール" : st ? "計測中" : "スタート前"}</span>
      <span class="note">${st ? `スタート ${fmtClock(S.race.start, true)} ・ 完走 ${finishedCount} / ${S.teams.length} チーム` : `${S.teams.length}チーム × ${S.legs}区`}</span>
    </div>
    <span class="spacer"></span>
    ${st ? "" : `<button class="startbtn" id="startBtn" ${S.teams.length ? "" : "disabled"}>スタート</button>`}
  </div>
  <div class="grid">${S.teams.map((t, i) => teamCard(t, i)).join("")}</div>
  <div class="toolbar">
    ${st ? `<button class="btn" id="editStart">スタート時刻を修正</button>` : ""}
    <a class="btn" href="#results" style="text-decoration:none">記録を見る</a>
  </div>
  <p class="note" style="margin-top:12px">タスキを渡した瞬間にそのチームの赤いボタンを押します。押し間違えたときは「取消」を2回押すと直前の記録が消えます。チームの並びは固定です。</p>`;
}
function teamCard(t, i){
  const sp = splits(t), n = sp.length, st = started(), fin = finished(t);
  const pos = positionOf(t);
  const prev = n > 0 ? `${n}区 ${esc(t.runners[n-1] || "")} <span class="num">${fmtDur(sp[n-1] - legStart(t, n-1))}</span>` : "";
  const ua = undoArmed[t.id] > Date.now();
  const undo = n > 0 ? `<button class="undo ${ua ? "armed" : ""}" data-act="undo">${ua ? "もう一度押すと取消" : "取消"}</button>` : "";
  if (fin) {
    const ranks = standings().filter(x => finished(x.t));
    const r = ranks.findIndex(x => x.t === t) + 1;
    return `<article class="team done" style="${tcs(i)}" data-team="${t.id}">
      <div class="hd"><span class="chip">${esc(t.name)}</span><span class="legpos">ゴール ${fmtClock(sp[S.legs-1])}</span></div>
      <div class="fin"><b>${r}位</b>完走</div>
      <div><span class="lbl">総合タイム</span><div class="legtime">${fmtDur(total(t))}</div></div>
      <div class="prev">アンカー ${prev}</div>${undo}</article>`;
  }
  const isLast = n === S.legs - 1;
  return `<article class="team" style="${tcs(i)}" data-team="${t.id}">
    <div class="hd"><span class="chip">${esc(t.name)}</span>${pos ? `<span class="rank">${pos}位</span>` : ""}<span class="legpos">${n+1}区 / ${S.legs}区</span></div>
    <div><span class="lbl">${st ? "走行中" : "第1走者"}</span><div class="runner">${esc(t.runners[n] || `${n+1}走`)}</div></div>
    <div class="legtime" ${st ? `data-since="${legStart(t, n)}"` : ""}>${st ? fmtDur(Date.now() - legStart(t, n)) : "0:00.0"}</div>
    <div class="prev">${prev ? "前区間 " + prev : ""}</div>
    <button class="pass ${isLast ? "goal" : ""}" data-act="pass" ${st ? "" : "disabled"}>${isLast ? "ゴール" : "タスキ渡し"}<small>${isLast ? `${esc(t.runners[n] || "")} がフィニッシュ` : `→ ${n+2}区 ${esc(t.runners[n+1] || "")}`}</small></button>
    ${undo}</article>`;
}
$("#v-race").addEventListener("pointerdown", e => {
  const b = e.target.closest('button[data-act="pass"]'); if (!b || b.disabled) return;
  e.preventDefault();
  const now = Date.now();
  const id = b.closest(".team").dataset.team, t = S.teams.find(x => x.id === id);
  if (!t || !started() || finished(t)) return;
  if (lastTap[id] && now - lastTap[id] < S.guard * 1000) { toast(`${t.name}：${S.guard}秒以内の連続タップは無視しました`); return; }
  lastTap[id] = now;
  splits(t).push(now); save();
  const n = splits(t).length;
  renderRace();
  const card = $(`.team[data-team="${id}"]`); if (card) { card.classList.add("flash"); }
  toast(finished(t) ? `${t.name} ゴール ${fmtDur(total(t))}` : `${t.name} ${n}区 ${t.runners[n-1] || ""} ${fmtDur(splits(t)[n-1] - legStart(t, n-1))}`);
  if (allDone()) releaseWake();
});
$("#v-race").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "startBtn") {
    if (started()) return;
    S.race = { start: Date.now(), splits: {} }; S.teams.forEach(t => S.race.splits[t.id] = []);
    save(); requestWake(); renderRace(); toast("スタートしました");
  } else if (b.dataset.act === "undo") {
    const id = b.closest(".team").dataset.team, t = S.teams.find(x => x.id === id);
    if (undoArmed[id] > Date.now()) {
      const v = splits(t).pop(); undoArmed[id] = 0; save(); renderRace();
      toast(`${t.name}：${fmtClock(v, true)} の記録を取り消しました`);
    } else { undoArmed[id] = Date.now() + 3000; renderRace(); setTimeout(() => view === "race" && renderRace(), 3100); }
  } else if (b.id === "editStart") openEdit({ type: "start" });
});

/* ---------- results ---------- */
let rMode = "ind", sortKey = "lap", sortDir = 1, legFilter = "all";
function renderResults(){
  const el = $("#v-results");
  if (!started()) { el.innerHTML = `${sampleBanner()}<div class="panel empty">まだ計測していません。「計測」でスタートすると、ここに個人記録とチーム総合が並びます。</div>${exportBar()}`; return; }
  const legOpts = `<option value="all">全区間</option>` + Array.from({length: S.legs}, (_, i) => `<option value="${i+1}" ${legFilter == i+1 ? "selected" : ""}>${i+1}区</option>`).join("");
  el.innerHTML = `${sampleBanner()}
  <div class="rtabs">
    <div class="seg" role="group" aria-label="表示">
      <button data-mode="ind" aria-pressed="${rMode === "ind"}">個人記録</button>
      <button data-mode="team" aria-pressed="${rMode === "team"}">チーム総合</button>
    </div>
    ${rMode === "ind" ? `<label class="row note" style="gap:6px">区間 <select id="legSel" class="tinput" style="width:auto">${legOpts}</select></label>` : ""}
  </div>
  <div class="tablebox">${rMode === "ind" ? indTable() : teamTable()}</div>
  <p class="note">${rMode === "ind" ? "見出しを押すと並び替えます。赤字は区間1位。「修正」でタスキを渡した時刻を直せます。" : "完走チームは総合タイム順、走行中のチームは進んだ区間順に並びます。"}</p>
  ${exportBar()}`;
}
function exportBar(){
  return `<div class="panel" style="margin-top:18px"><h2>書き出し</h2>
    <div class="row">
      <button class="btn primary" id="xlsx">エクセルで保存（.xlsx）</button>
      <button class="btn" id="csv">CSVで保存</button>
      <button class="btn" id="bk2">バックアップを保存（.json）</button>
    </div>
    <p class="note" style="margin-top:8px">エクセルには「チーム総合」「個人記録」「大会情報」の3シートが入ります。タイムは時間の値として入るので、エクセル上でも並び替えや計算ができます。</p></div>`;
}
function sortVal(r, k){
  switch(k){
    case "team": return r.ti; case "leg": return r.leg; case "name": return r.name;
    case "lap": return r.lap; case "rank": return r.rank; case "start": return r.start; case "end": return r.end;
  }
}
function indTable(){
  let rows = individualRows();
  if (legFilter !== "all") rows = rows.filter(r => r.leg == legFilter);
  rows.sort((a, b) => {
    const x = sortVal(a, sortKey), y = sortVal(b, sortKey);
    if (x == null && y == null) return a.ti - b.ti || a.leg - b.leg;
    if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return c * sortDir || a.ti - b.ti || a.leg - b.leg;
  });
  const th = (k, label) => `<th><button data-sort="${k}" ${sortKey === k ? `data-dir="${sortDir > 0 ? "▲" : "▼"}"` : ""}>${label}</button></th>`;
  return `<table><thead><tr>${th("team","チーム")}${th("leg","走順")}${th("name","名前")}${th("lap","区間タイム")}${th("rank","区間順位")}${th("start","走り始め")}${th("end","走り終わり")}<th></th></tr></thead><tbody>
  ${rows.map(r => `<tr>
    <td style="${tcs(r.ti)}"><span class="tdot"></span>${esc(r.team.name)}</td>
    <td class="t">${r.leg}区</td><td>${esc(r.name)}</td>
    <td class="t ${r.rank === 1 ? "best" : ""}">${r.lap != null ? fmtDur(r.lap) : (r.start != null && !finished(r.team) && splits(r.team).length === r.leg - 1 ? "走行中" : "—")}</td>
    <td class="t">${r.rank ?? "—"}</td>
    <td class="t">${fmtClock(r.start, true)}</td><td class="t">${fmtClock(r.end, true)}</td>
    <td>${r.end != null ? `<button class="mini" data-edit="${r.team.id}" data-i="${r.leg - 1}">修正</button>` : ""}</td>
  </tr>`).join("")}</tbody></table>`;
}
function teamTable(){
  const st = standings();
  const legRk = Array.from({length: S.legs}, (_, i) => legRanks(i));
  let place = 0;
  return `<table><thead><tr><th>順位</th><th>チーム</th><th>総合タイム</th><th>状況</th>${Array.from({length: S.legs}, (_, i) => `<th>${i+1}区</th>`).join("")}<th>ゴール時刻</th></tr></thead><tbody>
  ${st.map(({ t, idx, n }) => {
    const fin = finished(t); if (fin) place++;
    return `<tr><td class="rk">${fin ? place : "—"}</td>
      <td style="${tcs(idx)}"><span class="tdot"></span>${esc(t.name)}</td>
      <td class="t">${fin ? fmtDur(total(t)) : "—"}</td>
      <td>${fin ? "完走" : n === 0 ? "1区 走行中" : `${n+1}区 走行中`}</td>
      ${Array.from({length: S.legs}, (_, i) => n > i ? `<td class="t ${legRk[i][t.id] === 1 ? "best" : ""}" title="${esc(t.runners[i] || "")}">${fmtDur(splits(t)[i] - legStart(t, i))}</td>` : `<td class="t">—</td>`).join("")}
      <td class="t">${fin ? fmtClock(splits(t)[S.legs-1], true) : "—"}</td></tr>`;
  }).join("")}</tbody></table>`;
}
$("#v-results").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mode) { rMode = b.dataset.mode; renderResults(); }
  else if (b.dataset.sort) { const k = b.dataset.sort; if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; } renderResults(); }
  else if (b.dataset.edit) openEdit({ type: "split", id: b.dataset.edit, i: +b.dataset.i });
  else if (b.id === "xlsx") exportXlsx();
  else if (b.id === "csv") exportCsv();
  else if (b.id === "bk2") backup();
});
$("#v-results").addEventListener("change", e => { if (e.target.id === "legSel") { legFilter = e.target.value; renderResults(); } });

/* ---------- edit modal ---------- */
let editing = null;
function openEdit(target){
  editing = target;
  if (target.type === "start") {
    $("#mTitle").textContent = "スタート時刻を修正";
    $("#mNote").textContent = "スタートを押すのが遅れたときなどに、実際の号砲の時刻を入れます。全チームの1区タイムが変わります。";
    $("#mInput").value = fmtClock(S.race.start, true);
  } else {
    const t = S.teams.find(x => x.id === target.id);
    $("#mTitle").textContent = `${t.name} ${target.i+1}区の走り終わり時刻`;
    $("#mNote").textContent = `${t.runners[target.i] || ""} がタスキを渡した（ゴールした）時刻を「時:分:秒.1/10秒」で入れます。この区間と次の区間のタイムが変わります。`;
    $("#mInput").value = fmtClock(splits(t)[target.i], true);
  }
  $("#mErr").textContent = ""; $("#modal").hidden = false; $("#mInput").focus(); $("#mInput").select();
}
$("#mCancel").onclick = () => { $("#modal").hidden = true; editing = null; };
$("#modalForm").addEventListener("submit", e => {
  e.preventDefault(); if (!editing) return;
  const v = parseClock($("#mInput").value, S.race.start);
  if (v == null) { $("#mErr").textContent = "「10:23:45.6」の形で入力してください"; return; }
  if (editing.type === "start") {
    const firsts = S.teams.map(t => splits(t)[0]).filter(x => x != null);
    if (firsts.length && v >= Math.min(...firsts)) { $("#mErr").textContent = "1区の最初のタスキ渡しより前の時刻にしてください"; return; }
    S.race.start = v;
  } else {
    const t = S.teams.find(x => x.id === editing.id), sp = splits(t), i = editing.i;
    const lo = legStart(t, i), hi = sp[i + 1];
    if (v <= lo) { $("#mErr").textContent = `この区間の走り始め（${fmtClock(lo, true)}）より後にしてください`; return; }
    if (hi != null && v >= hi) { $("#mErr").textContent = `次の区間の走り終わり（${fmtClock(hi, true)}）より前にしてください`; return; }
    sp[i] = v;
  }
  save(); $("#modal").hidden = true; editing = null; render(); toast("修正しました");
});

/* ---------- export ---------- */
function stamp(){ const d = new Date(S.race.start || Date.now()), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; }
function baseName(){ return ((S.eventName || "駅伝").replace(/[\\/:*?"<>|]/g, "").trim() || "駅伝") + "_" + stamp(); }
async function saveFile(filename, data, mime){
  if (window.claude && typeof window.claude.use === "function") {
    let dl = null; try { dl = await window.claude.use("downloads"); } catch(e) {}
    if (!dl) { toast("この画面ではファイルを保存できません"); return; }
    try { await dl.save({ filename, data }); toast("保存しました"); }
    catch(err) { toast(err && err.code === "declined" ? "保存をやめました" : "保存できませんでした（" + ((err && (err.message || err.code)) || "不明") + "）"); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function backup(){ saveFile(baseName() + "_backup.json", JSON.stringify(S, null, 2), "application/json"); }
const DAY = 86400000;
function clockFrac(ep){ const d = new Date(ep); return (d.getHours()*3600000 + d.getMinutes()*60000 + d.getSeconds()*1000 + d.getMilliseconds()) / DAY; }
function exportXlsx(){
  if (typeof XLSX === "undefined") { toast("エクセル出力の部品を読み込めませんでした。CSVで保存してください"); return; }
  const wb = XLSX.utils.book_new();
  // team sheet
  const st = standings(); let place = 0;
  const tHead = ["順位","チーム名","総合タイム", ...Array.from({length: S.legs}, (_, i) => `${i+1}区`), "ゴール時刻"];
  const tRows = st.map(({ t, n }) => { const fin = finished(t); if (fin) place++;
    return [fin ? place : "", t.name, fin ? total(t) / DAY : "", ...Array.from({length: S.legs}, (_, i) => n > i ? (splits(t)[i] - legStart(t, i)) / DAY : ""), fin ? clockFrac(splits(t)[S.legs-1]) : ""]; });
  const ws1 = XLSX.utils.aoa_to_sheet([tHead, ...tRows]);
  fmtCols(ws1, tRows.length, [2, ...Array.from({length: S.legs}, (_, i) => 3 + i)], "[h]:mm:ss.0");
  fmtCols(ws1, tRows.length, [3 + S.legs], "hh:mm:ss.0");
  ws1["!cols"] = tHead.map((_, i) => ({ wch: i === 1 ? 16 : 11 }));
  XLSX.utils.book_append_sheet(wb, ws1, "チーム総合");
  // individual sheet (team order, leg order)
  const iHead = ["チーム名","走順","名前","区間タイム","区間順位","走り始めた時刻","走り終えた時刻","チーム総合タイム"];
  const iRows = individualRows().map(r => [r.team.name, r.leg, r.name, r.lap != null ? r.lap / DAY : "", r.rank ?? "", r.start != null ? clockFrac(r.start) : "", r.end != null ? clockFrac(r.end) : "", total(r.team) != null ? total(r.team) / DAY : ""]);
  const ws2 = XLSX.utils.aoa_to_sheet([iHead, ...iRows]);
  fmtCols(ws2, iRows.length, [3, 7], "[h]:mm:ss.0");
  fmtCols(ws2, iRows.length, [5, 6], "hh:mm:ss.0");
  ws2["!cols"] = [16, 6, 14, 11, 8, 13, 13, 14].map(w => ({ wch: w }));
  ws2["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: iRows.length, c: iHead.length - 1 } }) };
  XLSX.utils.book_append_sheet(wb, ws2, "個人記録");
  const info = XLSX.utils.aoa_to_sheet([["大会名", S.eventName], ["スタート時刻", fmtClock(S.race.start, true)], ["チーム数", S.teams.length], ["区間数", S.legs], ["書き出し", new Date().toLocaleString("ja-JP")]]);
  info["!cols"] = [{ wch: 12 }, { wch: 28 }];
  XLSX.utils.book_append_sheet(wb, info, "大会情報");
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  saveFile(baseName() + ".xlsx", new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}
function fmtCols(ws, n, cols, z){
  for (let r = 1; r <= n; r++) for (const c of cols) { const a = XLSX.utils.encode_cell({ r, c }); if (ws[a] && ws[a].t === "n") ws[a].z = z; }
}
function exportCsv(){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [["チーム名","走順","名前","区間タイム","区間順位","走り始めた時刻","走り終えた時刻","チーム総合タイム"].join(",")];
  individualRows().forEach(r => lines.push([r.team.name, r.leg, r.name, r.lap != null ? fmtDur(r.lap) : "", r.rank ?? "", fmtClock(r.start, true).replace("—",""), fmtClock(r.end, true).replace("—",""), total(r.team) != null ? fmtDur(total(r.team)) : ""].map(q).join(",")));
  saveFile(baseName() + "_個人記録.csv", "﻿" + lines.join("\r\n"), "text/csv");
}

/* ---------- wake lock & ticking ---------- */
let wake = null;
async function requestWake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch(e) {} }
function releaseWake(){ try { wake && wake.release(); } catch(e) {} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && started() && !allDone()) requestWake(); });
setInterval(() => {
  if (view !== "race" || !started()) return;
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = fmtDur(now - +el.dataset.since); });
}, 100);

window.addEventListener("hashchange", route);
if (started() && !allDone()) requestWake();
route();
})();
</script>
